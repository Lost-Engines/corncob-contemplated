<svg xmlns="http://www.w3.org/2000/svg" width="360" height="430" viewBox="0 0 360 430" role="img" aria-label="Model, world, camera and screen coordinate transforms"><rect width="360" height="430" rx="4" fill="#10231d"/><g font-family="ui-sans-serif,system-ui,sans-serif"><text x="18" y="29" fill="#edf2dd" font-size="20" >From a vertex to a pixel</text><rect x="28" y="57" width="304" height="64" fill="#294735" rx="5"/><text x="180" y="81" fill="#edf2dd" font-size="15" text-anchor="middle">Model</text><text x="180" y="104" fill="#bbccbd" font-size="12" text-anchor="middle">Local vertices</text><text x="180" y="141" fill="#f0cd82" font-size="22" text-anchor="middle">↓</text><rect x="28" y="149" width="304" height="64" fill="#294735" rx="5"/><text x="180" y="173" fill="#edf2dd" font-size="15" text-anchor="middle">Object → world</text><text x="180" y="196" fill="#bbccbd" font-size="12" text-anchor="middle">Object attitude</text><text x="180" y="233" fill="#f0cd82" font-size="22" text-anchor="middle">↓</text><rect x="28" y="241" width="304" height="64" fill="#294735" rx="5"/><text x="180" y="265" fill="#edf2dd" font-size="15" text-anchor="middle">World → view</text><text x="180" y="288" fill="#bbccbd" font-size="12" text-anchor="middle">Observer + camera</text><text x="180" y="325" fill="#f0cd82" font-size="22" text-anchor="middle">↓</text><rect x="28" y="333" width="304" height="64" fill="#294735" rx="5"/><text x="180" y="357" fill="#edf2dd" font-size="15" text-anchor="middle">View → screen</text><text x="180" y="380" fill="#bbccbd" font-size="12" text-anchor="middle">Clip, then divide</text></g></svg>
