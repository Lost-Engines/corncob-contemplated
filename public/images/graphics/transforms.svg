<svg xmlns="http://www.w3.org/2000/svg" width="820" height="280" viewBox="0 0 820 280" role="img" aria-label="Model, world, camera and screen coordinate transforms"><rect width="820" height="280" rx="4" fill="#10231d"/><g font-family="ui-sans-serif,system-ui,sans-serif"><text x="18" y="29" fill="#edf2dd" font-size="20" >From a vertex to a pixel</text><rect x="16" y="82" width="181" height="64" fill="#294735" rx="5"/><text x="106.5" y="106" fill="#edf2dd" font-size="15" text-anchor="middle">Model</text><text x="106.5" y="129" fill="#bbccbd" font-size="12" text-anchor="middle">Local vertices</text><text x="202" y="121" fill="#f0cd82" font-size="22" >→</text><rect x="221" y="82" width="181" height="64" fill="#294735" rx="5"/><text x="311.5" y="106" fill="#edf2dd" font-size="15" text-anchor="middle">Object → world</text><text x="311.5" y="129" fill="#bbccbd" font-size="12" text-anchor="middle">Object attitude</text><text x="407" y="121" fill="#f0cd82" font-size="22" >→</text><rect x="426" y="82" width="181" height="64" fill="#294735" rx="5"/><text x="516.5" y="106" fill="#edf2dd" font-size="15" text-anchor="middle">World → view</text><text x="516.5" y="129" fill="#bbccbd" font-size="12" text-anchor="middle">Observer + camera</text><text x="612" y="121" fill="#f0cd82" font-size="22" >→</text><rect x="631" y="82" width="181" height="64" fill="#294735" rx="5"/><text x="721.5" y="106" fill="#edf2dd" font-size="15" text-anchor="middle">View → screen</text><text x="721.5" y="129" fill="#bbccbd" font-size="12" text-anchor="middle">Clip, then divide</text><text x="410" y="211" fill="#a3d4ae" font-size="16" text-anchor="middle">Rotation matrices are combined for reuse.</text><text x="410" y="243" fill="#bbccbd" font-size="15" text-anchor="middle">Distance scaling keeps the integer coordinates in range.</text></g></svg>
